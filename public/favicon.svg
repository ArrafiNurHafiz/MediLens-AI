<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090E17"/>
      <stop offset="50%" stop-color="#0F172A"/>
      <stop offset="100%" stop-color="#081426"/>
    </linearGradient>

    <!-- Border Glow -->
    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8"/>
      <stop offset="50%" stop-color="#2DD4BF"/>
      <stop offset="100%" stop-color="#10B981"/>
    </linearGradient>

    <!-- Pill Cyan Half -->
    <linearGradient id="pillCyan" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8"/>
      <stop offset="100%" stop-color="#0284C7"/>
    </linearGradient>

    <!-- Pill Emerald Half -->
    <linearGradient id="pillEmerald" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34D399"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>

    <!-- Scan Beam Glow -->
    <linearGradient id="laserBeam" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0"/>
      <stop offset="25%" stop-color="#38BDF8" stop-opacity="0.8"/>
      <stop offset="50%" stop-color="#FFFFFF" stop-opacity="1"/>
      <stop offset="75%" stop-color="#34D399" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#34D399" stop-opacity="0"/>
    </linearGradient>

    <!-- Filter for Glow Effect -->
    <filter id="neonGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <filter id="softGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="16" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Base Squircle -->
  <rect x="16" y="16" width="480" height="480" rx="112" fill="url(#bgGrad)"/>
  <rect x="16" y="16" width="480" height="480" rx="112" fill="none" stroke="url(#borderGrad)" stroke-width="6" stroke-opacity="0.6"/>

  <!-- Subtle Camera Aperture / Focus Ring -->
  <circle cx="256" cy="256" r="160" fill="none" stroke="#0284C7" stroke-width="2.5" stroke-dasharray="10 8" stroke-opacity="0.35"/>
  <circle cx="256" cy="256" r="195" fill="none" stroke="#38BDF8" stroke-width="1.5" stroke-opacity="0.15"/>

  <!-- Viewfinder / Scanner Reticle Corner Brackets -->
  <g stroke="url(#borderGrad)" stroke-width="18" stroke-linecap="round" stroke-linejoin="round" fill="none" filter="url(#neonGlow)">
    <!-- Top Left -->
    <path d="M 120 160 L 120 120 L 160 120"/>
    <!-- Top Right -->
    <path d="M 352 120 L 392 120 L 392 160"/>
    <!-- Bottom Left -->
    <path d="M 120 352 L 120 392 L 160 392"/>
    <!-- Bottom Right -->
    <path d="M 352 392 L 392 392 L 392 352"/>
  </g>

  <!-- Central Medical Pill with 45 Degree Rotation -->
  <g transform="translate(256, 256) rotate(-45) translate(-256, -256)">
    <!-- Pill Drop Shadow / Ambient Glow -->
    <rect x="180" y="156" width="152" height="200" rx="76" fill="#0284C7" opacity="0.25" filter="url(#softGlow)"/>

    <!-- Left / Top Half (Cyan) -->
    <path d="M 180 256 A 76 76 0 0 1 332 256 Z" fill="url(#pillCyan)"/>
    
    <!-- Right / Bottom Half (Emerald) -->
    <path d="M 332 256 A 76 76 0 0 1 180 256 Z" fill="url(#pillEmerald)"/>

    <!-- Pill Specular Reflection / Glass Highlight -->
    <path d="M 204 186 Q 220 170 244 166 Q 228 186 226 240 Q 206 230 204 186 Z" fill="#FFFFFF" opacity="0.4"/>

    <!-- Pill Center Divider -->
    <line x1="180" y1="256" x2="332" y2="256" stroke="#090E17" stroke-width="8" stroke-linecap="round"/>
  </g>

  <!-- Horizontal Laser Scan Beam -->
  <line x1="88" y1="256" x2="424" y2="256" stroke="url(#laserBeam)" stroke-width="4.5" filter="url(#neonGlow)"/>
  
  <!-- Optical AI Lens Core Spark (Center Target) -->
  <circle cx="256" cy="256" r="14" fill="#FFFFFF" filter="url(#neonGlow)"/>
  <circle cx="256" cy="256" r="6" fill="#38BDF8"/>
  
  <!-- Medical Cross Accent (Top Right Corner Badge) -->
  <g transform="translate(356, 156)">
    <circle cx="0" cy="0" r="28" fill="#0F172A" stroke="#34D399" stroke-width="3"/>
    <path d="M -12 0 L 12 0 M 0 -12 L 0 12" stroke="#34D399" stroke-width="5" stroke-linecap="round"/>
  </g>
</svg>
